name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install & Configure Capacitor Android
        run: |
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mahi AI Assistant" "com.mahi.voiceassistant" --web-dir "dist"
          npx cap add android
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Format Release Filename
        id: prepare_asset
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ -z "$TAG" || "$TAG" == "main" || "$TAG" == "master" ]]; then
            TAG="v1.0.0"
          fi
          ASSET_NAME="mahi-voice-assistant-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "./${ASSET_NAME}"
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=./${ASSET_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Actions Artifact (Always Available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahi-voice-assistant-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.prepare_asset.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_asset.outputs.asset_name }}
          name: "Mahi Voice Assistant ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
